name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r exporter/requirements.txt
          pip install pytest ruff

      - name: Ruff (lint)
        run: ruff check exporter

      - name: Pytest
        run: pytest -q exporter

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t modem-exporter:ci ./exporter

      - name: Smoke test (exporter imports & serves)
        run: |
          # Point at a closed local port so the modem fetch fails fast.
          docker run -d --name ci -p 9877:9877 \
            -e MODEM_URL=http://127.0.0.1:1 -e MODEM_USERNAME=x -e MODEM_PASSWORD=y \
            -e SCRAPE_TIMEOUT=2 modem-exporter:ci
          sleep 4
          # /metrics must respond (up=0) even when the modem is unreachable
          curl -sf --max-time 8 http://localhost:9877/metrics | grep -q '^modem_up'
          docker rm -f ci
